[package]
name = "cc-island"
version = "0.3.9"
description = "Dynamic Island for Claude Code"
authors = ["you"]
edition = "2021"

[lib]
name = "cc_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Desktop GUI binary (default, compiled with default "desktop" feature)
[[bin]]
name = "cc-island"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = [
    "tauri",
    "tauri-plugin-shell",
    "tauri-plugin-single-instance",
    "dep:cocoa",
    "dep:objc",
    "dep:winreg",
    "dep:windows",
    "dep:gtk",
    "dep:tauri-build",
]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
# Tauri dependencies (optional for server mode)
tauri = { version = "2", features = ["macos-private-api", "tray-icon"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

# Core dependencies (always required for both modes)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
axum-extra = { version = "0.9", features = ["typed-routing"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
once_cell = "1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
native-tls = "0.2"
futures-util = "0.3"
twox-hash = "1.6"
qrcode = "0.14"
hostname = "0.4"
notify = { version = "8", features = ["macos_kqueue"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# OpenSSL configuration for server mode (vendored for static linking)
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

# macOS dependencies (optional, only for desktop GUI)
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = { version = "0.26", optional = true }
objc = { version = "0.2", optional = true }

# Windows dependencies (optional, only for desktop GUI)
[target.'cfg(target_os = "windows")'.dependencies]
winreg = { version = "0.52", optional = true }
windows = { version = "0.58", optional = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Foundation"
] }

# Linux dependencies (optional, only for desktop GUI)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

# Reduce export symbols for MinGW linker (fixes "export ordinal too large" error)
[profile.dev]
lto = false
codegen-units = 256

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
