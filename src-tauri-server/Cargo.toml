[package]
name = "cc-island-server"
version = "0.2.5"
description = "CC-Island Server Binary (background mode, no GUI)"
authors = ["you"]
edition = "2021"

[[bin]]
name = "cc-island-server"
path = "src/main.rs"

[dependencies]
# Import shared library from main package (disable default features to avoid GUI deps)
cc-island = { path = "../src-tauri", default-features = false }

# Core dependencies (minimal, no GUI)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenSSL configuration for musl static linking (vendored for server binary)
[target.'cfg(target_env = "musl")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"