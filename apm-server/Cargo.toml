[package]
name = "cc-island-apm"
version = "0.1.0"
description = "CC-Island APM Server - GreptimeDB writer, OTLP receiver/exporter"
authors = ["CC-Island Contributors"]
edition = "2021"

[[bin]]
name = "cc-island-apm"
path = "src/main.rs"

[lib]
name = "cc_island_apm"
path = "src/lib.rs"

[dependencies]
# HTTP server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for GreptimeDB
reqwest = { version = "0.12", features = ["json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Async channels
tokio-stream = "0.1"
futures = "0.3"

# Configuration
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"