name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      product_name:
        description: 'Product name displayed in the app (e.g., Ease-Island)'
        required: false
        default: 'Ease-Island'
        type: string

jobs:
  # ===== Cloud Server Build =====
  build-cloud-server:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: 'x86_64-unknown-linux-gnu'
            name: 'Linux x86_64'
            platform: 'ubuntu-latest'
            container: 'ubuntu:20.04'
          - target: 'aarch64-unknown-linux-gnu'
            name: 'Linux ARM64'
            platform: 'ubuntu-latest'
            container: 'ubuntu:20.04'

    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools (container)
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config libssl-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}
          workspaces: 'cloud-server -> cloud-server/target'

      - name: Install cross-compilation tools (ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build cloud server
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd cloud-server
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        run: |
          mkdir -p cloud-server-dist
          cp cloud-server/target/${{ matrix.target }}/release/cc-island-cloud cloud-server-dist/
          # Copy migrations
          cp -r cloud-server/migrations cloud-server-dist/
          # Copy docker-compose.yml
          cp cloud-server/docker-compose.yml cloud-server-dist/
          # Create .env.example
          echo "DATABASE_URL=postgres://ccisland:password@localhost:5432/ccisland" > cloud-server-dist/.env.example
          echo "WS_PORT=17528" >> cloud-server-dist/.env.example
          echo "CLEANUP_INTERVAL_SECS=3600" >> cloud-server-dist/.env.example
          echo "MAX_DEVICE_AGE_SECS=86400" >> cloud-server-dist/.env.example
          # Create README
          echo "# CC-Island Cloud Server" > cloud-server-dist/README.md
          echo "" >> cloud-server-dist/README.md
          echo "## Quick Start" >> cloud-server-dist/README.md
          echo "" >> cloud-server-dist/README.md
          echo "1. Start PostgreSQL: docker-compose up -d" >> cloud-server-dist/README.md
          echo "2. Set DATABASE_URL in .env file" >> cloud-server-dist/README.md
          echo "3. Run: ./cc-island-cloud" >> cloud-server-dist/README.md
          # Create archive
          cd cloud-server-dist
          tar -czvf cc-island-cloud-${{ matrix.target }}.tar.gz *

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-island-cloud_${{ matrix.target }}
          path: cloud-server-dist/cc-island-cloud-${{ matrix.target }}.tar.gz
          retention-days: 7

  # ===== Mobile App Build (H5 Web) =====
  build-mobile-h5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install mobile dependencies
        run: |
          cd mobile-app
          pnpm install

      - name: Build H5 web app
        run: |
          cd mobile-app
          pnpm run build

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create H5 archive
        run: |
          cd mobile-app
          mkdir -p h5-dist
          cp -r dist h5-dist/www
          # Create README
          echo "# CC-Island Mobile H5" > h5-dist/README.md
          echo "" >> h5-dist/README.md
          echo "## 部署说明" >> h5-dist/README.md
          echo "" >> h5-dist/README.md
          echo "这是一个静态网站，可以部署到任何静态文件服务器。" >> h5-dist/README.md
          echo "" >> h5-dist/README.md
          echo "### 部署选项" >> h5-dist/README.md
          echo "- Nginx/Apache: 将 www 目录内容放到服务器根目录" >> h5-dist/README.md
          echo "- GitHub Pages: 推送到 gh-pages 分支" >> h5-dist/README.md
          echo "- Cloudflare Pages: 直接部署 www 目录" >> h5-dist/README.md
          echo "- Vercel/Netlify: 导入项目并设置根目录为 www" >> h5-dist/README.md
          echo "" >> h5-dist/README.md
          echo "### 配置要求" >> h5-dist/README.md
          echo "- 需要配置 Cloud Server 的 WebSocket 地址" >> h5-dist/README.md
          echo "- 在设置页面输入服务器地址后即可使用" >> h5-dist/README.md
          # Create archive
          cd h5-dist
          tar -czvf cc-island-mobile-h5-${{ steps.version.outputs.VERSION }}.tar.gz *

      - name: Upload H5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-island-mobile-h5_${{ steps.version.outputs.VERSION }}
          path: mobile-app/h5-dist/cc-island-mobile-h5-${{ steps.version.outputs.VERSION }}.tar.gz
          retention-days: 7

  # ===== Mobile App Build (Android) =====
  build-mobile-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        run: |
          cd mobile-app
          pnpm install

      - name: Build web app
        run: |
          cd mobile-app
          pnpm run build

      - name: Sync Capacitor
        run: |
          cd mobile-app
          npx cap sync android

      - name: Build Android APK
        run: |
          cd mobile-app/android
          ./gradlew assembleDebug --no-daemon

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cc-island-mobile-android_${{ steps.version.outputs.VERSION }}
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ===== Mobile App Build (iOS - TestFlight) =====
  build-mobile-ios:
    runs-on: macos-latest
    # Skip iOS build if secrets not configured - handled in first step

    steps:
      - name: Check iOS secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.FASTLANE_APPLE_ID }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::iOS secrets not configured, skipping iOS build"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        if: steps.check-secrets.outputs.skip != 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Ruby
        if: steps.check-secrets.outputs.skip != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile-app/ios/App

      - name: Install mobile dependencies
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          cd mobile-app
          pnpm install

      - name: Build web app
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          cd mobile-app
          pnpm run build

      - name: Sync Capacitor
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          cd mobile-app
          npx cap sync ios

      - name: Install fastlane
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          cd mobile-app/ios/App
          bundle install

      - name: Setup Apple credentials
        if: steps.check-secrets.outputs.skip != 'true'
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_APPLE_PASSWORD: ${{ secrets.FASTLANE_APPLE_PASSWORD }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
        run: |
          # Create .env file for fastlane
          cd mobile-app/ios/App
          echo "FASTLANE_APPLE_ID=${FASTLANE_APPLE_ID}" > .env
          echo "FASTLANE_PASSWORD=${FASTLANE_APPLE_PASSWORD}" >> .env
          echo "FASTLANE_TEAM_ID=${FASTLANE_TEAM_ID}" >> .env

      - name: Build and upload to TestFlight
        if: steps.check-secrets.outputs.skip != 'true'
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_APPLE_PASSWORD }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
        run: |
          cd mobile-app/ios/App
          bundle exec fastlane ios beta

      - name: Get version
        if: steps.check-secrets.outputs.skip != 'true'
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload TestFlight info
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cc-island-mobile-ios_testflight_${{ steps.version.outputs.VERSION }}
          path: mobile-app/ios/App/build/App.ipa
          retention-days: 7
        continue-on-error: true  # IPA may not exist if upload failed

  # ===== Desktop App Build =====
  build-desktop:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            name: 'macOS (Apple Silicon)'
            ext: '.dmg'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            name: 'macOS (Intel)'
            ext: '.dmg'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'Windows'
            ext: '.msi'
          - platform: 'ubuntu-20.04'
            target: 'x86_64-unknown-linux-gnu'
            name: 'Linux'
            ext: '.deb'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set product name
        shell: bash
        run: |
          PRODUCT_NAME="${{ inputs.product_name || 'Ease-Island' }}"
          echo "Setting product name to: $PRODUCT_NAME"
          # Update tauri.conf.json (use perl for cross-platform compatibility)
          perl -pi -e 's/"productName": ".*"/"productName": "'"$PRODUCT_NAME"'"/' src-tauri/tauri.conf.json
          # Verify change
          cat src-tauri/tauri.conf.json | grep productName

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev rpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Get product name
        id: product
        run: |
          PRODUCT_NAME="${{ inputs.product_name || 'Ease-Island' }}"
          echo "NAME=$PRODUCT_NAME" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Don't create release here - let release job handle it
          tagName: ''
          releaseName: ''
          releaseBody: ''
          target: ${{ matrix.target }}

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Find artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        id: find-macos
        run: |
          # macOS build output location depends on target
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          else
            BUNDLE_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle"
          fi

          # Fallback to default release directory if target-specific doesn't exist
          if [ ! -d "$BUNDLE_DIR" ]; then
            BUNDLE_DIR="src-tauri/target/release/bundle"
          fi

          echo "Searching in: $BUNDLE_DIR"
          ls -la "$BUNDLE_DIR" 2>/dev/null || echo "Bundle directory not found"

          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" -type f 2>/dev/null | head -1)

          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            echo "::error::DMG file not found in $BUNDLE_DIR/dmg"
            echo "Directory contents:"
            find "$BUNDLE_DIR" -type f 2>/dev/null || echo "No files found"
            exit 1
          fi

          echo "Found DMG: $DMG"
          echo "DMG=$DMG" >> $GITHUB_OUTPUT
        shell: bash

      - name: Find artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        id: find-windows
        shell: pwsh
        run: |
          # Windows build output location - Tauri uses default target path
          $BUNDLE_DIR = "src-tauri\target\release\bundle"

          Write-Host "Searching in: $BUNDLE_DIR"
          if (Test-Path $BUNDLE_DIR) {
            Get-ChildItem -Path $BUNDLE_DIR -Recurse -Directory | ForEach-Object {
              Write-Host "Directory: $_"
              Get-ChildItem -Path $_.FullName -File | ForEach-Object { Write-Host "  File: $_" }
            }
          } else {
            Write-Host "Bundle directory not found at $BUNDLE_DIR"
          }

          # MSI path - Tauri creates MSI in msi subdirectory
          $MSI_PATH = "$BUNDLE_DIR\msi"
          $MSI = ""
          if (Test-Path $MSI_PATH) {
            $MSI = (Get-ChildItem -Path $MSI_PATH -Filter *.msi -File -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }

          # NSIS EXE path (if exists)
          $NSIS_PATH = "$BUNDLE_DIR\nsis"
          $EXE = ""
          if (Test-Path $NSIS_PATH) {
            $EXE = (Get-ChildItem -Path $NSIS_PATH -Filter *.exe -File -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }

          if (-not $MSI) {
            Write-Error "MSI file not found in $MSI_PATH"
            exit 1
          }

          Write-Host "Found MSI: $MSI"
          if ($EXE) {
            Write-Host "Found EXE: $EXE"
          }

          echo "MSI=$MSI" >> $env:GITHUB_OUTPUT
          if ($EXE) {
            echo "EXE=$EXE" >> $env:GITHUB_OUTPUT
          }

      - name: Find artifacts (Linux)
        if: matrix.platform == 'ubuntu-20.04'
        id: find-linux
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" -type f 2>/dev/null | head -1)
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" -type f 2>/dev/null | head -1)
          RPM=$(find src-tauri/target/release/bundle/rpm -name "*.rpm" -type f 2>/dev/null | head -1 || echo "")
          if [ -z "$DEB" ] || [ ! -f "$DEB" ]; then
            echo "::error::DEB file not found"
            exit 1
          fi
          if [ -z "$APPIMAGE" ] || [ ! -f "$APPIMAGE" ]; then
            echo "::error::AppImage file not found"
            exit 1
          fi
          echo "DEB=$DEB" >> $GITHUB_OUTPUT
          echo "RPM=$RPM" >> $GITHUB_OUTPUT
          echo "APPIMAGE=$APPIMAGE" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload artifact (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.NAME }}_${{ steps.version.outputs.VERSION }}_${{ matrix.target }}
          path: ${{ steps.find-macos.outputs.DMG }}
          retention-days: 7

      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.NAME }}_${{ steps.version.outputs.VERSION }}_${{ matrix.target }}
          path: |
            ${{ steps.find-windows.outputs.MSI }}
            ${{ steps.find-windows.outputs.EXE }}
          retention-days: 7

      - name: Upload artifact (Linux)
        if: matrix.platform == 'ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.NAME }}_${{ steps.version.outputs.VERSION }}_${{ matrix.target }}
          path: |
            ${{ steps.find-linux.outputs.DEB }}
            ${{ steps.find-linux.outputs.RPM }}
            ${{ steps.find-linux.outputs.APPIMAGE }}
          retention-days: 7

  # ===== Desktop Binary Build (standalone executable) =====
  build-binary:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            name: 'macOS-arm64'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            name: 'macOS-x64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'Windows-x64'
          - platform: 'ubuntu-20.04'
            target: 'x86_64-unknown-linux-gnu'
            name: 'Linux-x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set product name
        shell: bash
        run: |
          PRODUCT_NAME="${{ inputs.product_name || 'Ease-Island' }}"
          perl -pi -e 's/"productName": ".*"/"productName": "'"$PRODUCT_NAME"'"/' src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm run build

      - name: Build binary
        run: |
          cd src-tauri
          cargo build --release --target ${{ matrix.target }}

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Prepare binary (macOS/Linux)
        if: matrix.platform != 'windows-latest'
        run: |
          PRODUCT_NAME="${{ inputs.product_name || 'Ease-Island' }}"
          mkdir -p binary-dist
          BINARY_PATH="src-tauri/target/${{ matrix.target }}/release/cc-island"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "::error::Binary not found at $BINARY_PATH"
            ls -la src-tauri/target/*/release/ 2>/dev/null || echo "No release directories found"
            exit 1
          fi
          cp "$BINARY_PATH" binary-dist/${PRODUCT_NAME}-${{ matrix.name }}
          chmod +x binary-dist/${PRODUCT_NAME}-${{ matrix.name }}
          cd binary-dist
          tar -czvf ${PRODUCT_NAME}-${{ matrix.name }}-${{ steps.version.outputs.VERSION }}.tar.gz *

      - name: Prepare binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $PRODUCT_NAME = "${{ inputs.product_name || 'Ease-Island' }}"
          mkdir binary-dist
          cp src-tauri/target/${{ matrix.target }}/release/cc-island.exe binary-dist/${PRODUCT_NAME}-${{ matrix.name }}.exe
          cd binary-dist
          Compress-Archive -Path ${PRODUCT_NAME}-${{ matrix.name }}.exe -DestinationPath ${PRODUCT_NAME}-${{ matrix.name }}-${{ steps.version.outputs.VERSION }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-island-binary_${{ matrix.name }}_${{ steps.version.outputs.VERSION }}
          path: |
            binary-dist/*.tar.gz
            binary-dist/*.zip
          retention-days: 7

  release:
    needs: [build-cloud-server, build-desktop, build-binary, build-mobile-h5, build-mobile-android, build-mobile-ios]
    runs-on: ubuntu-latest
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.build-cloud-server.result == 'success' &&
      needs.build-desktop.result == 'success' &&
      needs.build-binary.result == 'success' &&
      needs.build-mobile-h5.result == 'success' &&
      needs.build-mobile-android.result == 'success' &&
      (needs.build-mobile-ios.result == 'success' || needs.build-mobile-ios.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "v0.0.1")
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configurationFile: .github/changelog-configuration.json
          fromTag: "${{ steps.prev_tag.outputs.PREV_TAG }}"
          toTag: "${{ github.ref_name }}"
          commitMode: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.product_name || 'Ease-Island' }} ${{ github.ref_name }}
          body: |
            ## Downloads

            ### Desktop App

            #### macOS
            - DMG for Apple Silicon (M1/M2/M3) and Intel Mac

            **注意：macOS 用户安装后如果提示"文件已损坏"，请运行以下命令：**
            ```bash
            xattr -cr /Applications/Ease-Island.app
            ```
            或前往 系统设置 > 隐私与安全 > 安全性，点击"仍要打开"。

            #### Windows
            - MSI installer and portable EXE

            #### Linux
            - DEB for Debian/Ubuntu
            - RPM for CentOS/RHEL/Fedora
            - AppImage for universal Linux (recommended)

            ### Standalone Binary

            可直接运行的可执行文件，无需安装：

            - `cc-island-binary_macOS-arm64_*.tar.gz` - macOS Apple Silicon
            - `cc-island-binary_macOS-x64_*.tar.gz` - macOS Intel
            - `cc-island-binary_Windows-x64_*.zip` - Windows x64
            - `cc-island-binary_Linux-x64_*.tar.gz` - Linux x64

            **使用方法：**
            ```bash
            # macOS/Linux
            tar -xzf cc-island-binary_*.tar.gz
            chmod +x Ease-Island-*
            ./Ease-Island-*

            # Windows: 解压 zip 后直接运行 Ease-Island-Windows-x64.exe
            ```

            **注意：** 可执行文件为后台模式，无 UI 界面，适合服务器部署。

            ### Cloud Server

            - `cc-island-cloud_x86_64-unknown-linux-gnu.tar.gz` - Linux x86_64 服务器
            - `cc-island-cloud_aarch64-unknown-linux-gnu.tar.gz` - Linux ARM64 服务器 (如 AWS Graviton)

            **部署步骤：**
            1. 解压: `tar -xzf cc-island-cloud_*.tar.gz`
            2. 启动 PostgreSQL: `docker-compose up -d`
            3. 配置 `.env` 文件 (参考 `.env.example`)
            4. 运行: `./cc-island-cloud`

            ### Mobile App

            #### H5 (Web 版本)
            - `cc-island-mobile-h5_*.tar.gz` - 纯 Web 版本，可部署到任何静态服务器
            - **部署步骤：**
              1. 解压: `tar -xzf cc-island-mobile-h5_*.tar.gz`
              2. 将 `www` 目录部署到静态服务器 (Nginx/GitHub Pages/Vercel 等)
              3. 在浏览器访问，设置 Cloud Server 地址即可使用

            #### Android
            - `cc-island-mobile-android_*.apk` - Android APK (unsigned)
            - **安装步骤：**
              1. 下载 APK 到手机
              2. 允许安装未知来源应用
              3. 安装 APK

            #### iOS (TestFlight)
            - iOS 版本通过 TestFlight 内部分发
            - **获取步骤：**
              1. 确保你的 Apple ID 已加入测试团队
              2. 在 iPhone 上安装 TestFlight app
              3. 通过邀请链接或邮件加入测试
              4. 安装 CC-Island Remote

            ---

            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
