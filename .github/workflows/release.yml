name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      product_name:
        description: 'Product name displayed in the app (e.g., Ease-Island)'
        required: false
        default: 'Ease-Island'
        type: string

jobs:
  # ===== Cloud Server Build =====
  build-cloud-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'x86_64-unknown-linux-gnu'
            name: 'Linux x86_64'
            platform: 'ubuntu-22.04'
          - target: 'aarch64-unknown-linux-gnu'
            name: 'Linux ARM64'
            platform: 'ubuntu-22.04'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}
          workspaces: 'cloud-server -> cloud-server/target'

      - name: Install cross-compilation tools (ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build cloud server
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd cloud-server
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        run: |
          mkdir -p cloud-server-dist
          cp cloud-server/target/${{ matrix.target }}/release/cc-island-cloud cloud-server-dist/
          # Copy migrations
          cp -r cloud-server/migrations cloud-server-dist/
          # Copy docker-compose.yml
          cp cloud-server/docker-compose.yml cloud-server-dist/
          # Create .env.example
          echo "DATABASE_URL=postgres://ccisland:password@localhost:5432/ccisland" > cloud-server-dist/.env.example
          echo "WS_PORT=17528" >> cloud-server-dist/.env.example
          echo "CLEANUP_INTERVAL_SECS=3600" >> cloud-server-dist/.env.example
          echo "MAX_DEVICE_AGE_SECS=86400" >> cloud-server-dist/.env.example
          # Create README
          echo "# CC-Island Cloud Server" > cloud-server-dist/README.md
          echo "" >> cloud-server-dist/README.md
          echo "## Quick Start" >> cloud-server-dist/README.md
          echo "" >> cloud-server-dist/README.md
          echo "1. Start PostgreSQL: docker-compose up -d" >> cloud-server-dist/README.md
          echo "2. Set DATABASE_URL in .env file" >> cloud-server-dist/README.md
          echo "3. Run: ./cc-island-cloud" >> cloud-server-dist/README.md
          # Create archive
          cd cloud-server-dist
          tar -czvf cc-island-cloud-${{ matrix.target }}.tar.gz *

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-island-cloud_${{ matrix.target }}
          path: cloud-server-dist/cc-island-cloud-${{ matrix.target }}.tar.gz
          retention-days: 7

  # ===== Mobile App Build (H5 Web) =====
  build-mobile-h5:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install mobile dependencies
        run: |
          cd mobile-app
          pnpm install

      - name: Build H5 web app
        run: |
          cd mobile-app
          pnpm run build

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Create H5 archive
        run: |
          cd mobile-app
          mkdir -p h5-dist
          cp -r dist h5-dist/www
          # Create README
          echo "# CC-Island Mobile H5" > h5-dist/README.md
          echo "" >> h5-dist/README.md
          echo "## 部署说明" >> h5-dist/README.md
          echo "" >> h5-dist/README.md
          echo "这是一个静态网站，可以部署到任何静态文件服务器。" >> h5-dist/README.md
          echo "" >> h5-dist/README.md
          echo "### 部署选项" >> h5-dist/README.md
          echo "- Nginx/Apache: 将 www 目录内容放到服务器根目录" >> h5-dist/README.md
          echo "- GitHub Pages: 推送到 gh-pages 分支" >> h5-dist/README.md
          echo "- Cloudflare Pages: 直接部署 www 目录" >> h5-dist/README.md
          echo "- Vercel/Netlify: 导入项目并设置根目录为 www" >> h5-dist/README.md
          echo "" >> h5-dist/README.md
          echo "### 配置要求" >> h5-dist/README.md
          echo "- 需要配置 Cloud Server 的 WebSocket 地址" >> h5-dist/README.md
          echo "- 在设置页面输入服务器地址后即可使用" >> h5-dist/README.md
          # Create archive
          cd h5-dist
          tar -czvf cc-island-mobile-h5-${{ steps.version.outputs.VERSION }}.tar.gz *

      - name: Upload H5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-island-mobile-h5_${{ steps.version.outputs.VERSION }}
          path: mobile-app/h5-dist/cc-island-mobile-h5-${{ steps.version.outputs.VERSION }}.tar.gz
          retention-days: 7

  # ===== Mobile App Build (Android) =====
  build-mobile-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        run: |
          cd mobile-app
          pnpm install

      - name: Build web app
        run: |
          cd mobile-app
          pnpm run build

      - name: Sync Capacitor
        run: |
          cd mobile-app
          npx cap sync android

      - name: Build Android APK
        run: |
          cd mobile-app/android
          ./gradlew assembleDebug --no-daemon

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cc-island-mobile-android_${{ steps.version.outputs.VERSION }}
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ===== Mobile App Build (iOS - TestFlight) =====
  build-mobile-ios:
    runs-on: macos-latest
    # Skip iOS build if secrets not configured - handled in first step

    steps:
      - name: Check iOS secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.FASTLANE_APPLE_ID }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::iOS secrets not configured, skipping iOS build"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        if: steps.check-secrets.outputs.skip != 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Ruby
        if: steps.check-secrets.outputs.skip != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile-app/ios/App

      - name: Install mobile dependencies
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          cd mobile-app
          pnpm install

      - name: Build web app
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          cd mobile-app
          pnpm run build

      - name: Sync Capacitor
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          cd mobile-app
          npx cap sync ios

      - name: Install fastlane
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          cd mobile-app/ios/App
          bundle install

      - name: Setup Apple credentials
        if: steps.check-secrets.outputs.skip != 'true'
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_APPLE_PASSWORD: ${{ secrets.FASTLANE_APPLE_PASSWORD }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
        run: |
          # Create .env file for fastlane
          cd mobile-app/ios/App
          echo "FASTLANE_APPLE_ID=${FASTLANE_APPLE_ID}" > .env
          echo "FASTLANE_PASSWORD=${FASTLANE_APPLE_PASSWORD}" >> .env
          echo "FASTLANE_TEAM_ID=${FASTLANE_TEAM_ID}" >> .env

      - name: Build and upload to TestFlight
        if: steps.check-secrets.outputs.skip != 'true'
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_APPLE_PASSWORD }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
        run: |
          cd mobile-app/ios/App
          bundle exec fastlane ios beta

      - name: Get version
        if: steps.check-secrets.outputs.skip != 'true'
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload TestFlight info
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cc-island-mobile-ios_testflight_${{ steps.version.outputs.VERSION }}
          path: mobile-app/ios/App/build/App.ipa
          retention-days: 7
        continue-on-error: true  # IPA may not exist if upload failed

  # ===== Desktop App Build =====
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            name: 'macOS (Apple Silicon)'
            ext: '.dmg'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            name: 'macOS (Intel)'
            ext: '.dmg'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'Windows'
            ext: '.msi'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            name: 'Linux'
            ext: '.deb'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set product name
        shell: bash
        run: |
          PRODUCT_NAME="${{ inputs.product_name || 'Ease-Island' }}"
          echo "Setting product name to: $PRODUCT_NAME"
          # Update tauri.conf.json (use perl for cross-platform compatibility)
          perl -pi -e 's/"productName": ".*"/"productName": "'"$PRODUCT_NAME"'"/' src-tauri/tauri.conf.json
          # Verify change
          cat src-tauri/tauri.conf.json | grep productName

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          target: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Get product name
        id: product
        run: |
          PRODUCT_NAME="${{ inputs.product_name || 'Ease-Island' }}"
          echo "NAME=$PRODUCT_NAME" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Don't create release here - let release job handle it
          tagName: ''
          releaseName: ''
          args: --target ${{ matrix.target }}

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Find artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        id: find-macos
        run: |
          # Determine bundle directory based on target
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          else
            BUNDLE_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle"
          fi

          # Fallback to default release directory
          if [ ! -d "$BUNDLE_DIR" ]; then
            BUNDLE_DIR="src-tauri/target/release/bundle"
          fi

          echo "Searching in: $BUNDLE_DIR"
          ls -la "$BUNDLE_DIR" 2>/dev/null || echo "Bundle directory not found"

          # Find DMG or app bundle
          DMG=$(find "$BUNDLE_DIR" -name "*.dmg" -type f 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            # Fallback: find .app bundle and create tar.gz (tar is always available on macOS)
            APP=$(find "$BUNDLE_DIR/macos" -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP" ]; then
              APP_NAME=$(basename "$APP")
              TAR_NAME="${APP_NAME%.app}_${{ matrix.target }}.tar.gz"
              cd "$BUNDLE_DIR/macos"
              tar -czf "$TAR_NAME" "$APP_NAME"
              DMG="$BUNDLE_DIR/macos/$TAR_NAME"
              echo "Created tar.gz from app bundle: $DMG"
            fi
          fi

          if [ -z "$DMG" ]; then
            echo "::error::No DMG or app bundle found"
            exit 1
          fi

          echo "Found artifact: $DMG"
          echo "DMG=$DMG" >> $GITHUB_OUTPUT
        shell: bash

      - name: Find artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        id: find-windows
        run: |
          # Determine bundle directory based on target (优先target-specific目录)
          $TargetBundleDir = "src-tauri\target\${{ matrix.target }}\release\bundle"
          $DefaultBundleDir = "src-tauri\target\release\bundle"

          Write-Host "Checking target-specific bundle: $TargetBundleDir"
          if (Test-Path $TargetBundleDir) {
            $BundleDir = $TargetBundleDir
          } else {
            Write-Host "Target-specific not found, checking default: $DefaultBundleDir"
            $BundleDir = $DefaultBundleDir
          }

          Write-Host "Using bundle directory: $BundleDir"
          if (Test-Path $BundleDir) {
            Get-ChildItem -Path $BundleDir -Recurse | ForEach-Object { Write-Host $_ }
          } else {
            Write-Error "Bundle directory not found: $BundleDir"
            exit 1
          }

          # Find MSI
          $MSI = Get-ChildItem -Path "$BundleDir\msi" -Filter *.msi -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $MSI) {
            Write-Error "MSI not found in $BundleDir\msi"
            exit 1
          }

          # Find NSIS EXE (optional)
          $EXE = Get-ChildItem -Path "$BundleDir\nsis" -Filter *.exe -File -ErrorAction SilentlyContinue | Select-Object -First 1

          Write-Host "Found MSI: $($MSI.FullName)"
          if ($EXE) { Write-Host "Found EXE: $($EXE.FullName)" }

          echo "MSI=$($MSI.FullName)" >> $env:GITHUB_OUTPUT
          if ($EXE) { echo "EXE=$($EXE.FullName)" >> $env:GITHUB_OUTPUT }
        shell: pwsh

      - name: Find artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        id: find-linux
        run: |
          # Determine bundle directory based on target
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            BUNDLE_DIR="src-tauri/target/release/bundle"
          fi

          echo "Searching in: $BUNDLE_DIR"
          ls -la "$BUNDLE_DIR" 2>/dev/null || echo "Bundle directory not found"

          # Find DEB
          DEB=$(find "$BUNDLE_DIR/deb" -name "*.deb" -type f 2>/dev/null | head -1)

          # Find AppImage
          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" -type f 2>/dev/null | head -1)

          if [ -z "$DEB" ] && [ -z "$APPIMAGE" ]; then
            echo "::error::No DEB or AppImage found"
            exit 1
          fi

          echo "Found DEB: $DEB"
          echo "Found AppImage: $APPIMAGE"
          echo "DEB=$DEB" >> $GITHUB_OUTPUT
          echo "APPIMAGE=$APPIMAGE" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload artifact (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.NAME }}_${{ steps.version.outputs.VERSION }}_${{ matrix.target }}
          path: ${{ steps.find-macos.outputs.DMG }}
          retention-days: 7

      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.NAME }}_${{ steps.version.outputs.VERSION }}_${{ matrix.target }}
          path: |
            ${{ steps.find-windows.outputs.MSI }}
            ${{ steps.find-windows.outputs.EXE }}
          retention-days: 7

      - name: Upload artifact (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.NAME }}_${{ steps.version.outputs.VERSION }}_${{ matrix.target }}
          path: |
            ${{ steps.find-linux.outputs.DEB }}
            ${{ steps.find-linux.outputs.APPIMAGE }}
          retention-days: 7

  # ===== Release Job =====

  release:
    needs: [build-desktop]
    runs-on: ubuntu-latest
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.build-desktop.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="v0.0.1"
          fi
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configurationFile: .github/changelog-configuration.json
          fromTag: "${{ steps.prev_tag.outputs.PREV_TAG }}"
          toTag: "${{ github.ref_name }}"
          commitMode: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: List artifacts
        run: ls -laR artifacts/ 2>/dev/null || echo "No artifacts found"
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.product_name || 'Ease-Island' }} ${{ github.ref_name }}
          body: |
            ## Changelog

            ${{ steps.changelog.outputs.changelog }}

            ---

            ## Downloads

            | Platform | File | 说明 |
            |----------|------|------|
            | macOS (Apple Silicon) | `*_aarch64-apple-darwin` | M1/M2/M3芯片 |
            | macOS (Intel) | `*_x86_64-apple-darwin` | Intel芯片 |
            | Windows | `*_x86_64-pc-windows-msvc` | MSI + EXE |
            | Linux | `*_x86_64-unknown-linux-gnu` | DEB + AppImage |
            | Cloud Server (x86_64) | `cc-island-cloud_x86_64` | Linux服务器 |
            | Cloud Server (ARM64) | `cc-island-cloud_aarch64` | AWS Graviton等 |
            | Mobile H5 | `cc-island-mobile-h5` | Web版本 |
            | Android | `cc-island-mobile-android` | APK |

            ### macOS 安装提示

            如果提示"文件已损坏"，运行：
            ```bash
            xattr -cr /Applications/${{ inputs.product_name || 'Ease-Island' }}.app
            ```

            ### Cloud Server 部署

            ```bash
            tar -xzf cc-island-cloud_*.tar.gz
            docker-compose up -d
            # 配置 .env 文件
            ./cc-island-cloud
            ```

            ### Mobile App

            - **H5**: 解压后部署 `www` 目录到任意静态服务器
            - **Android**: 直接安装 APK（需允许未知来源）
            - **iOS**: 通过 TestFlight 内部分发

          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
